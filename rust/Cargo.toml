[package]
name = "usage-monitor"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "UsageMonitor"
path = "src/main.rs"

[lib]
name = "usage_monitor"
path = "src/lib.rs"

[workspace]
exclude = ["proto"]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
png = "0.17"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
